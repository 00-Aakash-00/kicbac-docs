name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Mintlify docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run broken-links
      - run: pnpm run validate
      - run: pnpm run a11y
      - run: pnpm run build

  fixtures-sync:
    name: openapi/ subset matches kicbac-js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: 00-Aakash-00/kicbac-js
          path: upstream-kicbac-js
      - run: for f in data/amount-simulation.json data/avs-codes.json data/cvv-codes.json data/response-codes.json data/test-cards.json hosted-field-options.md kicbac.openapi.json webhooks/vectors.json; do diff "openapi/$f" "upstream-kicbac-js/openapi/$f" || exit 1; done
